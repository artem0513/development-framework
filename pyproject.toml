[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-se"
version = "0.1.0"
description = "Supervised project workflows, executed evidence and isolated SQLite memory"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ase = "ase.__main__:main"

[tool.setuptools.packages.find]
include = ["ase", "ase.*"]

[tool.setuptools.package-data]
ase = ["data/timezones/*", "data/timezones/**/*", "data/runtime_policy.json"]
